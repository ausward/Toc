name: Android build

# Builds the Play Store edition as an Android app: a debug APK to try on a phone, and the release bundle
# (.aab) for Google Play. With the signing secrets below set in the repository (Settings, Secrets and
# variables, Actions) the bundle is signed with the upload key; without them it is built unsigned, which
# still checks the build but is not something Play will take.
#   ANDROID_KEYSTORE_BASE64   the upload keystore, as base64 text (never commit the keystore)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# The build number is the run number, so each upload to Play has a higher one than the last.

on:
  push:
    paths:
      - 'android/**'
      - 'scripts/android-smoke.*'
      - 'capacitor.config.ts'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - name: Decode the upload keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "TOC_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "TOC_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TOC_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "TOC_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build the debug APK and the release bundle
        working-directory: android
        env:
          TOC_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug bundleRelease
      - name: Check what the app asks of the phone
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=$(ls android/app/build/outputs/apk/debug/*.apk)
          "$AAPT2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|uses-permission|native-code)" | tee badging.txt
          ls -l "$APK" android/app/build/outputs/bundle/release/*.aab
          # Google Play needs a recent target API for new apps.
          TARGET=$(sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p" badging.txt)
          test "$TARGET" -ge 35 || { echo "target SDK $TARGET is below 35"; exit 1; }
          # The game keeps everything on the device, so its permissions are the bare minimum. A new one means
          # a plugin was added: update the Data safety answers (docs/android-play-store.md) before allowing it.
          UNEXPECTED=$(sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" badging.txt | grep -vE '^(android.permission.INTERNET|com.tocfactory.game.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION)$' || true)
          if [ -n "$UNEXPECTED" ]; then echo "Unexpected permissions:"; echo "$UNEXPECTED"; exit 1; fi
          # No native code, so there is no 32- or 64-bit library to get wrong.
          if grep -q native-code badging.txt; then echo "native code present"; cat badging.txt; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: toc-factory-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: toc-factory-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

  # Installs the debug APK on an Android emulator and drives the real app: it starts, the system back
  # button steps out of screens, the video plays, the certificate opens Android's share sheet, progress
  # survives closing the app. Screenshots and the log are kept with the run.
  emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-package-lock playwright-core@1.49.1
      - uses: actions/download-artifact@v4
        with:
          name: toc-factory-debug-apk
          path: apk
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-smoke.sh apk/app-debug.apk smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-test
          path: smoke-out
